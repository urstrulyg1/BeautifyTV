name: Android add-ons CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-addons-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.addon }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        addon:
          - ad-blocking
          - airplay-status
          - bluetooth-connect
          - bluetooth-toggle
          - brightness
          - capacity-stats
          - digital-rain
          - flock
          - frigate-glance

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run unit tests, lint, and release build
        working-directory: addons/${{ matrix.addon }}
        run: ./gradlew --no-daemon testReleaseUnitTest lintRelease assembleRelease

      - name: Upload APK and reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.addon }}-build
          if-no-files-found: ignore
          path: |
            addons/${{ matrix.addon }}/app/build/outputs/apk/release/*.apk
            addons/${{ matrix.addon }}/app/build/reports/
            addons/${{ matrix.addon }}/app/build/test-results/
